<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aaooee timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg: #0d0f1a;
      --card: #1a1f2f;
      --text: #f9f4da;
      --accent: #67f7d0;
      --muted: #ffc46b;
      --danger: #ff6b9e;
      --border: #7e7aff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 14px 14px;
      padding: 1rem;
    }
    .timer-card {
      background: var(--card);
      padding: 2rem;
      text-align: center;
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0 #000;
      max-width: 760px;
      width: 100%;
    }
    .meta {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.8;
    }
    #display {
      font-size: clamp(2rem, 8vw, 4.2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 0.6rem 0 1rem;
      color: var(--accent);
      text-shadow: 4px 4px #000;
    }
    .unit-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 1rem 1.1rem;
      font-size: 0.65rem;
      font-weight: 600;
      border: 3px solid #000;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      line-height: 1.6;
      background: var(--accent);
      color: #09111f;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.08s ease;
    }
    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #000;
    }
    #finalMessage {
      margin-top: 1.2rem;
      color: var(--danger);
      font-size: 0.75rem;
      min-height: 1.2rem;
    }
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .confirm-overlay.open {
      display: flex;
    }
    .confirm-modal {
      width: min(460px, 100%);
      background: var(--card);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0 #000;
      padding: 1.2rem;
      text-align: center;
    }
    .confirm-title {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .confirm-question {
      font-size: 0.7rem;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }
    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="timer-card">
    <div class="meta" id="metaInfo">aaooee has itna seconds to say the name</div>
    <div id="display">29940</div>
    <div class="unit-label">Seconds Remaining</div>
    <button id="aoeBtn">i am aoe and i have the name</button>
    <div id="finalMessage" aria-live="polite"></div>
  </div>
  <div id="confirmOverlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmQuestion">
      <div id="confirmTitle" class="confirm-title">(≖_≖ )</div>
      <div id="confirmQuestion" class="confirm-question"></div>
      <div class="confirm-actions">
        <button id="confirmNo" type="button">n</button>
        <button id="confirmYes" type="button">m</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_SECONDS = 30000;
    const STORAGE_KEY = 'persistent_30000s_timer_1min_ago';

    const display = document.getElementById('display');
    const aoeBtn = document.getElementById('aoeBtn');
    const finalMessage = document.getElementById('finalMessage');
    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmQuestion = document.getElementById('confirmQuestion');
    const confirmNo = document.getElementById('confirmNo');
    const confirmYes = document.getElementById('confirmYes');

    function getIstTodayStartTimestamp() {
      const dateParts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Kolkata',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const year = Number(dateParts.find((part) => part.type === 'year').value);
      const month = Number(dateParts.find((part) => part.type === 'month').value);
      const day = Number(dateParts.find((part) => part.type === 'day').value);

      // 18:35 IST equals 13:05 UTC
      return Date.UTC(year, month - 1, day, 13, 5, 0, 0);
    }

    function createInitialState() {
      const startTimestamp = getIstTodayStartTimestamp();
      const targetEndTime = startTimestamp + (INITIAL_SECONDS * 1000);
      const now = Date.now();
      const timerStarted = now >= startTimestamp;
      const remainingMs = timerStarted
        ? Math.max(0, targetEndTime - now)
        : INITIAL_SECONDS * 1000;

      return {
        isRunning: timerStarted && remainingMs > 0,
        targetEndTime: timerStarted ? targetEndTime : null,
        remainingMs,
        startTimestamp
      };
    }

    let state = createInitialState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const scheduledStart = getIstTodayStartTimestamp();
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        state = createInitialState();
        saveState();
        return;
      }

      try {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.startTimestamp === scheduledStart) {
          state = parsed;
        } else {
          state = createInitialState();
          saveState();
        }
      } catch {
        state = createInitialState();
        saveState();
      }
    }

    function render() {
      if (state.isRunning && state.targetEndTime) {
        state.remainingMs = Math.max(0, state.targetEndTime - Date.now());
        if (state.remainingMs === 0) {
          state.isRunning = false;
          state.targetEndTime = null;
          saveState();
        }
      }

      const secondsLeft = Math.ceil(state.remainingMs / 1000);
      display.textContent = secondsLeft;
      document.title = `aaooee timer • ${secondsLeft}s`;
    }

    function askConfirm(question) {
      confirmQuestion.textContent = question;
      confirmOverlay.classList.add('open');
      confirmOverlay.setAttribute('aria-hidden', 'false');

      return new Promise((resolve) => {
        const cleanup = () => {
          confirmOverlay.classList.remove('open');
          confirmOverlay.setAttribute('aria-hidden', 'true');
          confirmYes.removeEventListener('click', onYes);
          confirmNo.removeEventListener('click', onNo);
          confirmOverlay.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeydown);
        };

        const onYes = () => {
          cleanup();
          resolve(true);
        };

        const onNo = () => {
          cleanup();
          resolve(false);
        };

        const onBackdrop = (event) => {
          if (event.target === confirmOverlay) {
            onNo();
          }
        };

        const onKeydown = (event) => {
          if (event.key === 'Escape') {
            onNo();
          } else if (event.key.toLowerCase() === 'm') {
            onYes();
          } else if (event.key.toLowerCase() === 'n') {
            onNo();
          }
        };

        confirmYes.addEventListener('click', onYes);
        confirmNo.addEventListener('click', onNo);
        confirmOverlay.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeydown);
      });
    }

    aoeBtn.addEventListener('click', async () => {
      const prompts = ['you sure?', 'pakka?', '100%?', 'fr?'];
      let allConfirmed = true;
      for (const question of prompts) {
        const confirmed = await askConfirm(question);
        if (!confirmed) {
          allConfirmed = false;
          break;
        }
      }
      finalMessage.textContent = allConfirmed ? 'oak. textmaxx.' : '';
    });

    loadState();
    render();
    setInterval(render, 100);
    document.addEventListener('visibilitychange', render);
  </script>
</body>
</html>
