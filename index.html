<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30000s Persistent Timer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .timer-card {
      background: var(--card);
      padding: 3rem 4rem;
      border-radius: 1.5rem;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    #display {
      font-size: 5.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin: 0.25rem 0;
      color: var(--accent);
    }
    .unit-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.7;
      margin-bottom: 2rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 0.8rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
    }
    #toggleBtn { background: var(--accent); color: #0f172a; }
    #restart1MinAgoBtn, #reset30000Btn { background: #334155; color: var(--text); }
  </style>
</head>
<body>
  <div class="timer-card">
    <div class="meta" id="metaInfo">30,000s Timer • Started 1 Min Ago (29,940s Left at Launch)</div>
    <div id="display">29940</div>
    <div class="unit-label">Seconds Remaining</div>
    <div class="controls">
      <button id="toggleBtn">Pause</button>
      <button id="restart1MinAgoBtn">Restart (1 Min Ago = 29940s)</button>
      <button id="reset30000Btn">Fresh 30000s</button>
    </div>
  </div>

  <script>
    const INITIAL_SECONDS = 30000;
    const OFFSET_SECONDS = 60; // Started 1 minute ago
    const STORAGE_KEY = 'persistent_30000s_timer_1min_ago';

    const display = document.getElementById('display');
    const toggleBtn = document.getElementById('toggleBtn');
    const restart1MinAgoBtn = document.getElementById('restart1MinAgoBtn');
    const reset30000Btn = document.getElementById('reset30000Btn');

    function createInitialState() {
      const startTimestamp = Date.now() - (OFFSET_SECONDS * 1000);
      const targetEndTime = startTimestamp + (INITIAL_SECONDS * 1000);
      return {
        isRunning: true,
        targetEndTime: targetEndTime,
        remainingMs: Math.max(0, targetEndTime - Date.now())
      };
    }

    let state = createInitialState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = JSON.parse(saved);
      } else {
        saveState();
      }
    }

    function render() {
      if (state.isRunning && state.targetEndTime) {
        state.remainingMs = Math.max(0, state.targetEndTime - Date.now());
        if (state.remainingMs === 0) {
          state.isRunning = false;
          state.targetEndTime = null;
          saveState();
        }
      }

      const secondsLeft = Math.ceil(state.remainingMs / 1000);
      display.textContent = secondsLeft;
      document.title = `${secondsLeft}s — Timer`;
      toggleBtn.textContent = state.isRunning ? 'Pause' : (secondsLeft === 0 ? 'Done' : 'Resume');
    }

    toggleBtn.addEventListener('click', () => {
      if (state.remainingMs <= 0) return;
      if (state.isRunning) {
        state.remainingMs = Math.max(0, state.targetEndTime - Date.now());
        state.isRunning = false;
        state.targetEndTime = null;
      } else {
        state.isRunning = true;
        state.targetEndTime = Date.now() + state.remainingMs;
      }
      saveState();
      render();
    });

    restart1MinAgoBtn.addEventListener('click', () => {
      state = createInitialState();
      saveState();
      render();
    });

    reset30000Btn.addEventListener('click', () => {
      state = {
        isRunning: true,
        targetEndTime: Date.now() + INITIAL_SECONDS * 1000,
        remainingMs: INITIAL_SECONDS * 1000
      };
      saveState();
      render();
    });

    loadState();
    render();
    setInterval(render, 100);
    document.addEventListener('visibilitychange', render);
  </script>
</body>
</html>
